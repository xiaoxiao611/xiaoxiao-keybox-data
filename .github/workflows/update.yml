name: Update Attestation Data
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch from Google
        run: |
          curl -fsSL --max-time 30 -o status.json https://android.googleapis.com/attestation/status
          curl -fsSL --max-time 30 -o root.json   https://android.googleapis.com/attestation/root

      - name: Commit and push
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add status.json root.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "auto update $(date -u +%Y-%m-%d)"
          git push
